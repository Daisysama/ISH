<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ISH · Make a WISH — Validation Demo</title>
<style>
  :root{
    --bg:#f5f3ee; --panel:#ffffff; --ink:#131512; --muted:#6f746c;
    --line:#e5e2d9; --brand:#1b5e4a; --brand2:#2d7b62; --soft:#e8f3ee;
    --warn:#a66b17; --danger:#9f3f3f; --shadow:0 18px 60px rgba(27,31,26,.10);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.45}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  .app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
  aside{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:#efede7}
  .brand{display:flex;gap:12px;align-items:center;padding:4px 8px 24px}
  .brandmark{width:42px;height:42px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.5px}
  .brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}
  nav{display:grid;gap:7px}
  .navbtn{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;color:#41463f;display:flex;justify-content:space-between;align-items:center}
  .navbtn:hover,.navbtn.active{background:#fff;color:var(--ink);box-shadow:0 4px 20px rgba(0,0,0,.04)}
  .aside-foot{position:absolute;left:18px;right:18px;bottom:20px}
  .mini{font-size:12px;color:var(--muted)}
  main{padding:28px 34px 60px;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
  .topbar h2{font-size:25px;margin:0}.topbar .subtitle{color:var(--muted);font-size:14px;margin-top:4px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:12px;color:var(--ink)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.06)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.brand{background:var(--brand);color:#fff;border-color:var(--brand);padding:10px 16px}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger)}
  .hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:18px;margin-bottom:22px}
  .hero-main,.hero-side,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 28px rgba(27,31,26,.04)}
  .hero-main{padding:30px;background:linear-gradient(145deg,#fff 0%,#f7fbf8 100%)}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
  .hero h3{font-size:36px;line-height:1.12;margin:10px 0 12px;letter-spacing:-.02em}
  .hero p{color:#555d54;max-width:760px;margin:0 0 20px}
  .flow{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
  .flow span{background:#f0f1ec;border:1px solid #e3e5df;padding:7px 10px;border-radius:999px;font-size:12px}
  .hero-side{padding:22px}.hero-side h4{margin:0 0 12px;font-size:15px}
  .metric{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}.metric:first-of-type{border-top:0}.metric b{font-size:19px}
  .section{display:none}.section.active{display:block}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .card{padding:18px;min-width:0}
  .project-card{display:flex;flex-direction:column;min-height:250px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .tag{font-size:11px;border:1px solid var(--line);padding:4px 8px;border-radius:999px;background:#fafaf8;color:#62685f}
  .tag.brand{background:var(--soft);border-color:#cee1d7;color:var(--brand)}
  .tag.warn{background:#fff5e5;border-color:#ecd9b8;color:var(--warn)}
  .tag.dark{background:#272a26;color:white;border-color:#272a26}
  .project-card h4,.work-card h4{margin:3px 0 7px;font-size:18px}
  .muted{color:var(--muted)}
  .project-card p{font-size:13px;color:#5d635b;margin:0 0 12px}
  .project-card .footer{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .avatars{display:flex}.avatar{width:27px;height:27px;border-radius:50%;border:2px solid #fff;background:#dfe7e1;display:grid;place-items:center;font-size:11px;margin-left:-6px}.avatar:first-child{margin-left:0}
  .toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
  .panel-title{font-size:18px;margin:0 0 4px}
  .kicker{font-size:13px;color:var(--muted);margin-bottom:14px}
  .empty{padding:42px;text-align:center;border:1px dashed #d6d4cb;border-radius:18px;color:var(--muted);background:rgba(255,255,255,.55)}
  .project-page{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}
  .timeline{display:grid;gap:10px}.timeline-item{display:grid;grid-template-columns:18px 1fr;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:var(--brand);margin-top:5px}.lineblock{padding:0 0 13px;border-bottom:1px solid var(--line)}
  .progressbar{height:8px;background:#ecece7;border-radius:999px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--brand)}
  .field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#555d54;font-weight:650}.field input,.field textarea,.field select{width:100%;border:1px solid #dcdad2;background:#fff;border-radius:11px;padding:10px 11px;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8aa99b;box-shadow:0 0 0 3px #e9f2ed}
  dialog{border:0;padding:0;border-radius:20px;width:min(720px,calc(100vw - 24px));box-shadow:var(--shadow)}dialog::backdrop{background:rgba(17,20,17,.45);backdrop-filter:blur(3px)}
  .modal-head{padding:20px 22px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:20px 22px;max-height:70vh;overflow:auto}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 16px}.tab{border:0;background:transparent;padding:9px 11px;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
  .tabpane{display:none}.tabpane.active{display:block}
  .clause{padding:12px;border-radius:12px;background:#f5f5f1;border:1px solid var(--line);font-size:13px;margin-bottom:8px}
  .milestone{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
  .check{width:24px;height:24px;border-radius:8px;border:1px solid #cfd1ca;background:#fff}.check.done{background:var(--brand);color:white;border-color:var(--brand)}
  .work-card{position:relative}.relation{position:absolute;right:14px;top:14px;font-size:10px;border-radius:999px;padding:4px 7px;background:#f4ecec;color:#7e4848;border:1px solid #ead6d6}
  .scoreline{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;font-size:12px;margin:7px 0}.bar{height:6px;background:#eee;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#333}
  .taste-chips{display:flex;gap:8px;flex-wrap:wrap}.taste-chip{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px;font-size:12px}.taste-chip.selected{background:var(--ink);color:white;border-color:var(--ink)}
  .uc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.uc{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.uc b{display:block;font-size:12px;margin-bottom:5px}.uc small{color:var(--muted)}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--brand)}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .audit{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.audit-row{display:grid;grid-template-columns:150px 140px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .toast{position:fixed;right:20px;bottom:20px;background:#171917;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:99}.toast.show{opacity:1;transform:none}
  .mobile-head{display:none}
  @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.project-page{grid-template-columns:1fr}.uc-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.app{display:block}aside{display:none}main{padding:18px 14px 80px}.mobile-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.hero-main{padding:22px}.hero h3{font-size:29px}.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h2{font-size:22px}.uc-grid{grid-template-columns:1fr}.audit-row{grid-template-columns:1fr;gap:2px}.mobile-nav{position:fixed;left:10px;right:10px;bottom:10px;background:#1d211d;border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);z-index:30;box-shadow:var(--shadow)}.mobile-nav button{border:0;background:transparent;color:#c9cec7;font-size:10px;padding:8px 2px}.mobile-nav button.active{color:white}.mobile-nav span{display:block;font-size:18px;margin-bottom:2px}}
  @media(min-width:721px){.mobile-nav{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="brandmark">ISH</div><div><h1>伊始</h1><small>Make a WISH.</small></div></div>
    <nav id="nav"></nav>
    <div class="aside-foot">
      <button class="btn" style="width:100%;margin-bottom:8px" onclick="openUC()">查看 9 个 UC 覆盖</button>
      <button class="btn ghost danger" style="width:100%" onclick="resetDemo()">重置验证数据</button>
      <div class="mini" style="margin-top:10px">验证原型 · LocalStorage<br>无后端 / 无真实支付 / 无真实身份认证</div>
    </div>
  </aside>
  <main>
    <div class="mobile-head"><div class="brand" style="padding:0"><div class="brandmark">ISH</div><div><h1>伊始</h1><small>Validation Demo</small></div></div><button class="btn" onclick="openUC()">UC</button></div>
    <div id="content"></div>
  </main>
</div>
<div class="mobile-nav" id="mobileNav"></div>
<div class="toast" id="toast"></div>

<dialog id="modal"><div id="modalContent"></div></dialog>
<dialog id="ucModal">
  <div class="modal-head"><div><b>ISH V0.1 · 9 个核心 Use Case</b><div class="mini">这不是截图页：每个核心 UC 在当前验证原型里都有可操作路径。</div></div><button class="btn" onclick="ucModal.close()">关闭</button></div>
  <div class="modal-body"><div class="uc-grid" id="ucGrid"></div></div>
</dialog>

<script>
const KEY='ish_validation_v01_20260907';
const now=()=>new Date().toISOString();
const fmt=(iso)=>new Date(iso).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const seed=()=>({
 currentUser:{id:'u_me',name:'Lysander',skills:['产品','策划','写作'],bio:'想把奇思妙想变成真实项目。'},
 taste:['强剧情','慢热','科幻'],
 projects:[
  {id:'p1',title:'纸月 / Paper Moon',category:'Galgame',summary:'一部发生在近未来海滨城的悬疑视觉小说。记忆可以被备份，但“我”还是原来的我吗？',needs:['Live2D','配乐'],mode:'兴趣共创 · 商业化后再按契约分配',duration:'4-6个月',owner:'u_aya',members:[{id:'u_aya',name:'Aya',role:'编剧/发起人'},{id:'u_k',name:'K',role:'程序'}],status:'Vertical Slice',visibility:'公开',created:'2026-08-12T10:00:00',milestones:[{id:'m11',name:'世界观与主线大纲',done:true},{id:'m12',name:'核心玩法原型',done:true},{id:'m13',name:'Vertical Slice',done:false},{id:'m14',name:'Steam Demo',done:false}],agreement:{version:'1.0',confirmed:['u_aya','u_k'],clauses:['当前阶段不领取固定报酬，所有成员明确知情并自愿参与。','加入前已有作品与素材归原权利人；项目共同成果按团队协议处理。','商业化前需全体核心成员确认正式收益分配方案。','退出成员的署名、成果继续使用和后续收益依约处理。']},updates:[{t:'2026-08-12T10:00:00',text:'项目发愿'},{t:'2026-08-26T21:00:00',text:'核心玩法原型完成'}]},
  {id:'p2',title:'凌晨四点的县城',category:'短片/纪录片',summary:'记录凌晨四点仍在工作的普通人：早餐铺、夜班护士、货运司机、清洁工。',needs:['摄影','收音','剪辑'],mode:'兴趣共创 · 非商业试作',duration:'6周',owner:'u_lin',members:[{id:'u_lin',name:'Lin',role:'导演'}],status:'企划',visibility:'公开',created:'2026-08-30T09:30:00',milestones:[{id:'m21',name:'拍摄对象名单',done:true},{id:'m22',name:'试拍10分钟',done:false},{id:'m23',name:'粗剪',done:false}],agreement:{version:'0.9',confirmed:['u_lin'],clauses:['第一阶段为非商业共同创作。','参与者可以将本人贡献部分用于个人作品集。','商业化发生前必须重新确认版权与收益。']},updates:[{t:'2026-08-30T09:30:00',text:'项目发愿'}]},
  {id:'p3',title:'Tiny Colony',category:'独立游戏',summary:'一款30分钟一局的微型殖民地经营游戏，核心是“有限空间里的艰难取舍”。',needs:['像素美术','音效'],mode:'商业项目 · Demo阶段无固定报酬',duration:'3个月',owner:'u_neo',members:[{id:'u_neo',name:'Neo',role:'程序/策划'},{id:'u_me',name:'Lysander',role:'测试/产品反馈'}],status:'Prototype',visibility:'公开',created:'2026-09-01T18:20:00',milestones:[{id:'m31',name:'资源循环原型',done:true},{id:'m32',name:'第一张完整地图',done:false},{id:'m33',name:'可公开试玩Build',done:false}],agreement:{version:'1.0',confirmed:['u_neo'],clauses:['Demo阶段无固定报酬，所有参与者可随时退出。','商业版本收益比例在公开Demo前重新签订。','所有贡献均保留作者署名。']},updates:[{t:'2026-09-01T18:20:00',text:'项目发愿'},{t:'2026-09-05T15:10:00',text:'资源循环原型完成'}]}
 ],
 applications:[],
 works:[
  {id:'w1',projectId:'p_demo1',title:'回声走廊',type:'独立游戏',summary:'一款没有Jump Scare的心理恐怖步行模拟。',url:'https://store.steampowered.com/',tags:['慢热','心理恐怖','探索','强氛围'],metrics:{剧情密度:72,操作负担:28,情绪强度:86,探索自由:64},fit:'喜欢环境叙事、心理恐怖和慢节奏探索的玩家',avoid:'期待高强度战斗或快速刺激的玩家',relation:'无商业关系',editorial:'ISH编辑完整体验约4小时后标记；推荐理由不含付费权重。'},
  {id:'w2',projectId:'p_demo2',title:'群星之间没有邮差',type:'Galgame',summary:'宇宙通讯延迟数十年，一封信可能在收件人死后才抵达。',url:'#',tags:['强剧情','慢热','科幻','大量阅读'],metrics:{剧情密度:94,操作负担:16,情绪强度:78,探索自由:20},fit:'重视文本、世界观、人物关系的叙事玩家',avoid:'不喜欢长文本与慢热铺垫的玩家',relation:'ISH参与发行',editorial:'商业关系已披露；编辑结论独立于发行团队。'}
 ],
 audit:[
  {t:'2026-09-01T09:00:00',type:'SYSTEM',text:'验证原型初始化'},
  {t:'2026-09-05T15:10:00',type:'MILESTONE',text:'Tiny Colony：资源循环原型完成'}
 ]
});
let state=load();
let route='discover';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function audit(type,text){state.audit.unshift({t:now(),type,text});state.audit=state.audit.slice(0,100)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function resetDemo(){if(confirm('重置所有本地验证数据？')){localStorage.removeItem(KEY);state=seed();route='discover';render();toast('已重置')}}
const navItems=[['discover','发现','⌕'],['create','发愿','＋'],['mine','我的项目','◫'],['portfolio','项目履历','◎'],['works','作品与推荐','◇'],['trust','透明度','⊙']];
function navTo(r){route=r;document.getElementById('modal').close?.();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){
 document.getElementById('nav').innerHTML=navItems.map(([id,n,ic])=>`<button class="navbtn ${route===id?'active':''}" onclick="navTo('${id}')"><span>${ic} ${n}</span><span>›</span></button>`).join('');
 document.getElementById('mobileNav').innerHTML=navItems.slice(0,5).map(([id,n,ic])=>`<button class="${route===id?'active':''}" onclick="navTo('${id}')"><span>${ic}</span>${n}</button>`).join('');
}
function header(title,sub,actions=''){return `<div class="topbar"><div><h2>${title}</h2><div class="subtitle">${sub}</div></div><div class="row">${actions}</div></div>`}
function render(){renderNav(); const c=document.getElementById('content'); if(route==='discover')c.innerHTML=discover(); if(route==='create')c.innerHTML=createPage(); if(route==='mine')c.innerHTML=mine(); if(route==='portfolio')c.innerHTML=portfolio(); if(route==='works')c.innerHTML=worksPage(); if(route==='trust')c.innerHTML=trustPage(); bindAfterRender()}
function discover(){
 const pcount=state.projects.length, teams=state.projects.filter(p=>p.members.length>=2).length, done=state.projects.reduce((n,p)=>n+p.milestones.filter(m=>m.done).length,0);
 return `${header('发现愿望','不是招聘信息流，而是正在等待同行者的真实项目。',`<button class="btn brand" onclick="navTo('create')">＋ 发一个愿</button>`)}
 <div class="hero"><section class="hero-main"><div class="eyebrow">ISH · Validation Prototype</div><h3>让一个想法找到人，<br>让一群人把它做出来。</h3><p>这是一个可交互验证网页。发愿、加入、立契、推进、履历、发布、标签、推荐、透明度九个核心 Use Case 均有最小可操作路径。</p><div class="row"><button class="btn primary" onclick="navTo('create')">发第一个愿</button><button class="btn" onclick="openUC()">看 UC 覆盖</button></div><div class="flow"><span>Idea</span><span>→ People</span><span>→ Trust</span><span>→ Execution</span><span>→ Work</span><span>→ Audience</span></div></section>
 <aside class="hero-side"><h4>验证数据</h4><div class="metric"><span>公开项目</span><b>${pcount}</b></div><div class="metric"><span>已形成团队</span><b>${teams}</b></div><div class="metric"><span>完成里程碑</span><b>${done}</b></div><div class="metric"><span>当前身份</span><b style="font-size:14px">${esc(state.currentUser.name)}</b></div></aside></div>
 <div class="toolbar"><input id="search" class="search" placeholder="搜索：Galgame / 音乐 / 科幻 / 摄影…" oninput="filterProjects(this.value)"><div class="row"><button class="btn" onclick="quickFilter('游戏')">游戏</button><button class="btn" onclick="quickFilter('短片')">短片</button><button class="btn" onclick="quickFilter('兴趣')">兴趣合作</button></div></div>
 <div class="grid" id="projectGrid">${state.projects.map(projectCard).join('')}</div>`
}
function projectCard(p){
 const done=p.milestones.filter(m=>m.done).length,total=p.milestones.length, pct=total?Math.round(done/total*100):0;
 return `<article class="card project-card" data-search="${esc((p.title+' '+p.category+' '+p.summary+' '+p.needs.join(' ')+' '+p.mode).toLowerCase())}"><div class="row" style="justify-content:space-between"><span class="tag brand">${esc(p.category)}</span><span class="mini">${esc(p.status)}</span></div><h4>${esc(p.title)}</h4><p>${esc(p.summary)}</p><div class="tags">${p.needs.map(n=>`<span class="tag">缺 ${esc(n)}</span>`).join('')}<span class="tag warn">${esc(p.mode)}</span></div><div class="mini">里程碑 ${done}/${total}</div><div class="progressbar" style="margin:7px 0 12px"><i style="width:${pct}%"></i></div><div class="footer"><div class="avatars">${p.members.slice(0,4).map(m=>`<span class="avatar" title="${esc(m.name)} · ${esc(m.role)}">${esc(m.name.slice(0,1))}</span>`).join('')}</div><div class="row"><button class="btn" onclick="openProject('${p.id}')">查看</button>${!p.members.some(m=>m.id===state.currentUser.id)?`<button class="btn primary" onclick="openJoin('${p.id}')">愿同行</button>`:''}</div></div></article>`
}
function filterProjects(q){q=q.trim().toLowerCase();document.querySelectorAll('#projectGrid .project-card').forEach(el=>el.style.display=!q||el.dataset.search.includes(q)?'flex':'none')}
function quickFilter(q){const s=document.getElementById('search');s.value=q;filterProjects(q)}
function createPage(){return `${header('发一个愿','把“我有个想法”变成别人能够理解和响应的项目。')}<div class="card" style="max-width:820px"><h3 class="panel-title">Create a Wish</h3><div class="kicker">UC-01 · Idea → People</div><form onsubmit="createProject(event)"><div class="field"><label>项目名称</label><input name="title" required placeholder="例如：一部关于凌晨四点县城的纪录片"></div><div class="field"><label>一句话说明你想做什么</label><textarea name="summary" required placeholder="不要写招聘JD，告诉别人为什么这件事值得一起做。"></textarea></div><div class="row"><div class="field" style="flex:1"><label>类型</label><select name="category"><option>独立游戏</option><option>Galgame</option><option>短片/纪录片</option><option>音乐</option><option>小说/IP</option><option>软件/AI</option><option>其他</option></select></div><div class="field" style="flex:1"><label>预计周期</label><input name="duration" placeholder="例如：3个月"></div></div><div class="field"><label>还缺什么人？用逗号分隔</label><input name="needs" required placeholder="例如：程序, 像素美术, 配乐"></div><div class="field"><label>当前合作模式</label><select name="mode"><option>兴趣共创 · 暂无金钱交换</option><option>兴趣共创 · 商业化后重新确认收益</option><option>商业项目 · 有预算</option><option>非商业/开源</option></select></div><div class="clause"><b>ISH V0.1 原则：</b>钱可以暂时没有，合作边界不能没有。团队形成后会进入“立契”步骤。</div><button class="btn brand" type="submit">发布愿望</button></form></div>`}
function createProject(e){e.preventDefault();const f=new FormData(e.target);const p={id:uid('p'),title:f.get('title'),category:f.get('category'),summary:f.get('summary'),needs:String(f.get('needs')).split(/[,，]/).map(s=>s.trim()).filter(Boolean),mode:f.get('mode'),duration:f.get('duration')||'待议',owner:state.currentUser.id,members:[{id:state.currentUser.id,name:state.currentUser.name,role:'发起人'}],status:'企划',visibility:'公开',created:now(),milestones:[{id:uid('m'),name:'定义第一个可验证成果',done:false}],agreement:{version:'0.1',confirmed:[],clauses:['当前合作性质与报酬情况已向所有成员明确。','加入前已有IP归原权利人。','商业化前必须明确收益、IP、退出和署名规则。']},updates:[{t:now(),text:'项目发愿'}]};state.projects.unshift(p);audit('WISH',`${p.title}：项目发愿`);save();route='mine';render();toast('愿望已发布')}
function openJoin(id){const p=state.projects.find(x=>x.id===id);openModal(`<div class="modal-head"><div><b>愿同行 · ${esc(p.title)}</b><div class="mini">UC-02 · 不投传统简历，告诉团队你能一起做什么。</div></div><button class="btn" onclick="modal.close()">关闭</button></div><form onsubmit="submitJoin(event,'${id}')"><div class="modal-body"><div class="field"><label>我能贡献什么</label><input name="role" required placeholder="例如：配乐 / Unity程序 / 剪辑"></div><div class="field"><label>为什么想参加</label><textarea name="why" required placeholder="兴趣、经验、你对项目的理解…"></textarea></div><div class="field"><label>每周大概能投入</label><input name="time" placeholder="例如：6-8小时"></div><div class="field"><label>作品/经历（Demo可直接写文字）</label><textarea name="proof" placeholder="例如：做过两首独立游戏BGM；链接…"></textarea></div></div><div class="modal-foot"><button class="btn" type="button" onclick="modal.close()">取消</button><button class="btn primary">提交申请</button></div></form>`)}
function submitJoin(e,id){e.preventDefault();const f=new FormData(e.target);state.applications.push({id:uid('a'),projectId:id,userId:state.currentUser.id,name:state.currentUser.name,role:f.get('role'),why:f.get('why'),time:f.get('time'),proof:f.get('proof'),status:'pending',t:now()});audit('APPLICATION',`${state.currentUser.name} 申请加入 ${state.projects.find(p=>p.id===id).title}`);save();document.getElementById('modal').close();toast('申请已提交（Demo中可在项目页模拟接受）')}
function openProject(id){const p=state.projects.find(x=>x.id===id);const isMember=p.members.some(m=>m.id===state.currentUser.id);const apps=state.applications.filter(a=>a.projectId===id&&a.status==='pending');const done=p.milestones.filter(m=>m.done).length;const pct=p.milestones.length?Math.round(done/p.milestones.length*100):0;
 openModal(`<div class="modal-head"><div><b>${esc(p.title)}</b><div class="mini">Born on ISH · ${fmt(p.created)}</div></div><button class="btn" onclick="modal.close()">关闭</button></div><div class="modal-body"><div class="tabs"><button class="tab active" onclick="tabSwitch(this,'ov')">项目</button><button class="tab" onclick="tabSwitch(this,'contract')">立契</button><button class="tab" onclick="tabSwitch(this,'mile')">航标</button><button class="tab" onclick="tabSwitch(this,'publish')">成事</button></div>
 <div class="tabpane active" id="ov"><div class="project-page"><div><span class="tag brand">${esc(p.category)}</span><h2 style="margin:8px 0">${esc(p.title)}</h2><p class="muted">${esc(p.summary)}</p><div class="tags">${p.needs.map(n=>`<span class="tag">缺 ${esc(n)}</span>`).join('')}</div><h4>团队</h4>${p.members.map(m=>`<div class="clause"><b>${esc(m.name)}</b> · ${esc(m.role)}</div>`).join('')}${apps.length?`<h4>待处理申请（Demo）</h4>${apps.map(a=>`<div class="clause"><b>${esc(a.name)}</b> · ${esc(a.role)}<br><span class="mini">${esc(a.why)}</span><div style="margin-top:8px"><button class="btn primary" onclick="acceptApp('${id}','${a.id}')">接受加入</button></div></div>`).join('')}`:''}</div><aside><div class="card" style="box-shadow:none"><div class="mini">当前阶段</div><b>${esc(p.status)}</b><div class="progressbar" style="margin:10px 0"><i style="width:${pct}%"></i></div><div class="mini">${done}/${p.milestones.length} 个航标完成</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="mini">合作模式</div><div style="font-size:13px;margin-top:4px">${esc(p.mode)}</div></div></aside></div></div>
 <div class="tabpane" id="contract"><div class="kicker">UC-03 · People → Trust</div><h3>项目契约 v${esc(p.agreement.version)}</h3>${p.agreement.clauses.map(c=>`<div class="clause">${esc(c)}</div>`).join('')}<div class="mini" style="margin:10px 0">已确认：${p.agreement.confirmed.length?p.agreement.confirmed.map(id=>esc(p.members.find(m=>m.id===id)?.name||id)).join('、'):'暂无'}</div>${isMember&&!p.agreement.confirmed.includes(state.currentUser.id)?`<button class="btn primary" onclick="confirmAgreement('${id}')">我已阅读并确认</button>`:''}${isMember?`<button class="btn" style="margin-left:6px" onclick="addClause('${id}')">新增一条变更</button>`:''}</div>
 <div class="tabpane" id="mile"><div class="kicker">UC-04 · Trust → Execution</div><h3>航标 / Milestones</h3>${p.milestones.map(m=>`<div class="milestone"><button class="check ${m.done?'done':''}" ${isMember?`onclick="toggleMilestone('${id}','${m.id}')"`:''}>${m.done?'✓':''}</button><div><b>${esc(m.name)}</b><div class="mini">${m.done?'已完成':'待完成'}</div></div></div>`).join('')}${isMember?`<button class="btn" style="margin-top:12px" onclick="addMilestone('${id}')">＋ 添加航标</button>`:''}<h4 style="margin-top:20px">项目轨迹</h4><div class="timeline">${p.updates.slice().reverse().map(u=>`<div class="timeline-item"><div class="dot"></div><div class="lineblock"><b>${esc(u.text)}</b><div class="mini">${fmt(u.t)}</div></div></div>`).join('')}</div></div>
 <div class="tabpane" id="publish"><div class="kicker">UC-06 · Execution → Work</div>${isMember?`<h3>发布项目成果</h3><form onsubmit="publishWork(event,'${id}')"><div class="field"><label>作品名称</label><input name="title" required value="${esc(p.title)}"></div><div class="field"><label>作品链接</label><input name="url" placeholder="Steam / B站 / 网站 / Demo链接"></div><div class="field"><label>作品标签</label><input name="tags" placeholder="例如：强剧情, 科幻, 慢热"></div><div class="field"><label>目标受众</label><textarea name="fit" placeholder="什么人可能会喜欢它？"></textarea></div><button class="btn primary">生成作品页</button></form>`:`<div class="empty">加入团队后可以发布成果。</div>`}</div></div>`)}
function tabSwitch(btn,id){btn.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const root=btn.closest('.modal-body');root.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));root.querySelector('#'+id).classList.add('active')}
function acceptApp(pid,aid){const p=state.projects.find(x=>x.id===pid),a=state.applications.find(x=>x.id===aid);if(!p.members.some(m=>m.id===a.userId))p.members.push({id:a.userId,name:a.name,role:a.role});a.status='accepted';p.updates.push({t:now(),text:`${a.name} 加入团队（${a.role}）`});audit('TEAM',`${p.title}：${a.name} 加入团队`);save();document.getElementById('modal').close();openProject(pid);toast('已加入团队')}
function confirmAgreement(pid){const p=state.projects.find(x=>x.id===pid);if(!p.agreement.confirmed.includes(state.currentUser.id))p.agreement.confirmed.push(state.currentUser.id);audit('CONTRACT',`${p.title}：${state.currentUser.name} 确认项目契约`);save();document.getElementById('modal').close();openProject(pid);toast('契约已确认')}
function addClause(pid){const text=prompt('输入新的契约条款/变更说明：');if(!text)return;const p=state.projects.find(x=>x.id===pid);p.agreement.clauses.push(text);p.agreement.version=(parseFloat(p.agreement.version||1)+0.1).toFixed(1);p.agreement.confirmed=[];p.updates.push({t:now(),text:`项目契约更新至 v${p.agreement.version}`});audit('CONTRACT',`${p.title}：契约更新至 v${p.agreement.version}`);save();document.getElementById('modal').close();openProject(pid)}
function toggleMilestone(pid,mid){const p=state.projects.find(x=>x.id===pid),m=p.milestones.find(x=>x.id===mid);m.done=!m.done;p.updates.push({t:now(),text:`航标「${m.name}」${m.done?'完成':'重新打开'}`});if(m.done)p.status=m.name;audit('MILESTONE',`${p.title}：${m.name} ${m.done?'完成':'重新打开'}`);save();document.getElementById('modal').close();openProject(pid)}
function addMilestone(pid){const name=prompt('下一个航标是什么？');if(!name)return;const p=state.projects.find(x=>x.id===pid);p.milestones.push({id:uid('m'),name,done:false});p.updates.push({t:now(),text:`新增航标：${name}`});audit('MILESTONE',`${p.title}：新增航标 ${name}`);save();document.getElementById('modal').close();openProject(pid)}
function publishWork(e,pid){e.preventDefault();const f=new FormData(e.target),p=state.projects.find(x=>x.id===pid);const tags=String(f.get('tags')).split(/[,，]/).map(x=>x.trim()).filter(Boolean);state.works.unshift({id:uid('w'),projectId:pid,title:f.get('title'),type:p.category,summary:p.summary,url:f.get('url')||'#',tags,metrics:{剧情密度:65,操作负担:45,情绪强度:60,探索自由:50},fit:f.get('fit')||'等待ISH编辑/社区进一步标注',avoid:'待标注',relation:'无商业关系',editorial:'项目方自助发布；尚未完成ISH编辑评测。'});p.status='已发布成果';p.updates.push({t:now(),text:'发布公开作品页'});audit('WORK',`${p.title}：发布作品页`);save();document.getElementById('modal').close();route='works';render();toast('作品页已生成')}
function mine(){const ps=state.projects.filter(p=>p.members.some(m=>m.id===state.currentUser.id)||p.owner===state.currentUser.id);return `${header('我的项目','真正的项目事实，而不是“熟练掌握团队协作”。',`<button class="btn brand" onclick="navTo('create')">＋ 发愿</button>`)}${ps.length?`<div class="grid">${ps.map(projectCard).join('')}</div>`:`<div class="empty">你还没有参加项目。</div>`}`}
function portfolio(){const ps=state.projects.filter(p=>p.members.some(m=>m.id===state.currentUser.id));const ws=state.works.filter(w=>ps.some(p=>p.id===w.projectId));return `${header('项目履历','UC-05 · Prove by Doing：让真实作品替代空洞的简历形容词。')}<div class="hero" style="grid-template-columns:.65fr 1.35fr"><div class="card"><div class="avatar" style="width:64px;height:64px;margin:0;font-size:20px">L</div><h3>${esc(state.currentUser.name)}</h3><p class="muted">${esc(state.currentUser.bio)}</p><div class="tags">${state.currentUser.skills.map(x=>`<span class="tag brand">${esc(x)}</span>`).join('')}</div><div class="metric"><span>参与项目</span><b>${ps.length}</b></div><div class="metric"><span>公开成果</span><b>${ws.length}</b></div></div><div class="card"><h3 class="panel-title">ISH Portfolio</h3><div class="kicker">系统只展示可验证项目事实，不生成单一“信用分”。</div>${ps.map(p=>{const me=p.members.find(m=>m.id===state.currentUser.id);return `<div class="clause"><div class="row" style="justify-content:space-between"><b>${esc(p.title)}</b><span class="tag">${esc(p.status)}</span></div><div class="mini">角色：${esc(me?.role||'成员')} · 航标完成 ${p.milestones.filter(m=>m.done).length}/${p.milestones.length}</div></div>`}).join('')||'<div class="empty">参加一个真实项目后，履历会自动长出来。</div>'}</div></div>`}
function worksPage(){const recommended=[...state.works].map(w=>({...w,match:w.tags.filter(t=>state.taste.includes(t)).length})).sort((a,b)=>b.match-a.match);return `${header('作品与推荐','从项目到受众：ISH不只问“热不热”，还问“它究竟适合谁”。')}<div class="card" style="margin-bottom:14px"><h3 class="panel-title">你的口味（Demo）</h3><div class="kicker">UC-08 · Work → Audience。点击改变偏好，推荐顺序会立即变化。</div><div class="taste-chips">${['强剧情','慢热','科幻','心理恐怖','探索','大量阅读','高操作','轻松'].map(t=>`<button class="taste-chip ${state.taste.includes(t)?'selected':''}" onclick="toggleTaste('${t}')">${t}</button>`).join('')}</div></div><div class="grid">${recommended.map(workCard).join('')}</div>`}
function workCard(w){return `<article class="card work-card"><span class="relation">${esc(w.relation)}</span><span class="tag brand">${esc(w.type)}</span><h4>${esc(w.title)}</h4><p class="muted" style="font-size:13px">${esc(w.summary)}</p><div class="tags">${w.tags.map(t=>`<span class="tag ${state.taste.includes(t)?'dark':''}">${esc(t)}</span>`).join('')}</div><div class="clause"><b>适合：</b>${esc(w.fit)}<br><b>慎入：</b>${esc(w.avoid)}</div>${Object.entries(w.metrics).map(([k,v])=>`<div class="scoreline"><span>${esc(k)}</span><div class="bar"><i style="width:${v}%"></i></div><span>${v}</span></div>`).join('')}<div class="mini" style="margin-top:10px">推荐解释：${esc(w.editorial)}</div><div class="footer" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><button class="btn" onclick="curateWork('${w.id}')">编辑标签</button><a class="btn primary" href="${esc(w.url)}" target="_blank" rel="noopener">查看作品</a></div></article>`}
function toggleTaste(t){const i=state.taste.indexOf(t);if(i>=0)state.taste.splice(i,1);else state.taste.push(t);audit('TASTE',`${state.currentUser.name} ${i>=0?'移除':'加入'}偏好：${t}`);save()}
function curateWork(id){const w=state.works.find(x=>x.id===id);openModal(`<div class="modal-head"><div><b>理解作品 · ${esc(w.title)}</b><div class="mini">UC-07 · 不是买一个总分，而是描述作品与受众。</div></div><button class="btn" onclick="modal.close()">关闭</button></div><form onsubmit="saveCurate(event,'${id}')"><div class="modal-body"><div class="field"><label>标签（逗号分隔）</label><input name="tags" value="${esc(w.tags.join(', '))}"></div><div class="field"><label>适合谁</label><textarea name="fit">${esc(w.fit)}</textarea></div><div class="field"><label>不适合谁</label><textarea name="avoid">${esc(w.avoid)}</textarea></div><div class="field"><label>ISH 与作品的商业关系</label><select name="relation"><option ${w.relation==='无商业关系'?'selected':''}>无商业关系</option><option ${w.relation==='ISH参与发行'?'selected':''}>ISH参与发行</option><option ${w.relation==='付费广告合作'?'selected':''}>付费广告合作</option><option ${w.relation==='ISH持有项目权益'?'selected':''}>ISH持有项目权益</option></select></div></div><div class="modal-foot"><button class="btn primary">保存并公开披露</button></div></form>`)}
function saveCurate(e,id){e.preventDefault();const f=new FormData(e.target),w=state.works.find(x=>x.id===id);w.tags=String(f.get('tags')).split(/[,，]/).map(x=>x.trim()).filter(Boolean);w.fit=f.get('fit');w.avoid=f.get('avoid');w.relation=f.get('relation');w.editorial='标签与商业关系已更新；所有修改进入透明度日志。';audit('EDITORIAL',`${w.title}：更新作品标签/商业关系披露`);save();document.getElementById('modal').close();toast('编辑信息已更新并留痕')}
function trustPage(){return `${header('透明度与信任','UC-09 · Trust the Platform：不要要求用户相信ISH是好人，让关键行为可被验证。')}<div class="hero" style="grid-template-columns:1fr 1fr"><div class="card"><h3 class="panel-title">规则防火墙（概念验证）</h3><div class="clause"><b>编辑 ≠ 广告</b><br>商业合作必须明确标记，不允许购买编辑结论。</div><div class="clause"><b>项目事实 ≠ 社会评分</b><br>保存做过什么，不生成一个决定人格价值的“87分”。</div><div class="clause"><b>变更必须留痕</b><br>契约、里程碑、商业关系修改进入审计日志。</div><div class="clause"><b>秘密数据最小化</b><br>生产版会把身份、支付、秘密投票等进一步权限隔离；本页仅为前端验证。</div></div><div class="card"><h3 class="panel-title">三张网络</h3><div class="clause"><b>Project Graph</b><br>人、项目、作品怎样连接。</div><div class="clause"><b>Collaboration Graph</b><br>谁和谁真正一起做过事情。</div><div class="clause"><b>Taste Graph</b><br>什么作品适合什么人，以及为什么。</div><p class="mini">真正护城河不是这几个HTML按钮，而是这些网络随着真实项目持续积累。</p></div></div><div class="card"><h3 class="panel-title">不可静默修改的 Demo 审计轨迹</h3><div class="kicker">生产系统需要真正的服务器审计、权限隔离和备份；这里用 LocalStorage 验证交互逻辑。</div><div class="audit">${state.audit.map(a=>`<div class="audit-row"><span>${fmt(a.t)}</span><b>${esc(a.type)}</b><span>${esc(a.text)}</span></div>`).join('')}</div></div>`}
function openModal(html){const m=document.getElementById('modal');document.getElementById('modalContent').innerHTML=html;m.showModal()}
