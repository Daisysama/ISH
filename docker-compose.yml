services:
  postgres:
    image: postgres:16-alpine
    container_name: ish-postgres
    environment:
      POSTGRES_USER: ish
      POSTGRES_PASSWORD: ish_dev_password
      POSTGRES_DB: ish
    ports:
      - "5433:5432"
    volumes:
      - ish_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ish -d ish"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: ish-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ISH_DATABASE_URL: postgresql+psycopg://ish:ish_dev_password@postgres:5432/ish
      ISH_TEST_DATABASE_URL: postgresql+psycopg://ish:ish_dev_password@postgres:5432/ish_test
      ISH_JWT_SECRET: dev-only-secret-change-in-production
      ISH_COOKIE_SECURE: "false"
      ISH_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ISH_SEED_ON_START: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["./entrypoint.sh"]

  frontend:
    build: ./frontend
    container_name: ish-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ish_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  ish_pgdata:
  ish_node_modules:
