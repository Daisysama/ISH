# ISH / fromish.com — Nginx reverse proxy
# Place at /etc/nginx/sites-available/fromish.com, then symlink into sites-enabled.
# This first-stage config is HTTP-only so Certbot can validate the domain.
# After `certbot --nginx -d fromish.com -d www.fromish.com`, Certbot will add HTTPS.

# Auth endpoints perform bcrypt work, so rate-limit them to reduce brute-force / CPU abuse.
# sites-enabled is included inside nginx's `http {}` block on Ubuntu, so this directive is valid here.
limit_req_zone $binary_remote_addr zone=ish_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name fromish.com www.fromish.com;

    client_max_body_size 1m;

    location = /login {
        limit_req zone=ish_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /register {
        limit_req zone=ish_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
